<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Day</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#bfe9ff; font-family: "Trebuchet MS", "Comic Sans MS", system-ui, sans-serif; }
  * { user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  body.locked, body.locked * { cursor:none !important; }

  #start { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
    background:linear-gradient(#8fd8ff,#ffe9a8); text-align:center; z-index:10; padding:24px; }
  #start.hidden { display:none; }
  #start h1 { margin:0; font-size:clamp(32px,6vw,64px); color:#3b2a6e; }
  #startBtn { font:inherit; font-size:clamp(22px,4vw,40px); font-weight:700; color:#fff; background:#ff6b9a; border:0;
    border-radius:999px; padding:20px 54px; box-shadow:0 8px 0 #c93d6c; cursor:pointer; }
  #startBtn:active { transform:translateY(6px); box-shadow:0 2px 0 #c93d6c; }
  #start p { margin:0; max-width:34em; color:#3b2a6e; font-size:clamp(14px,2vw,18px); line-height:1.5; }
  #start code { background:#fff8; padding:2px 8px; border-radius:6px; }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="start">
  <h1></h1>
  <button id="startBtn">Check PC Condition</button>
  <p> <code id="hint"></code>.</p>
</div>

<script>
/* ============ SETTINGS (change these) ============ */
const SECRET = { shift: true, ctrl: false, alt: false, code: "KeyJ" };  // Shift + J
const SOUND_ON_TOUCH = false;   // true = soft "pop" sound when baby presses something
/* ================================================== */


const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const startEl = document.getElementById("start");
let W, H, DPR, locked = false, wakeLock = null;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize", resize); resize();

/* ---------- Lock / unlock ---------- */
async function enterFullscreen(){
  try {
    const el = document.documentElement;
    if (!document.fullscreenElement) await (el.requestFullscreen?.({navigationUI:"hide"}) || el.webkitRequestFullscreen?.());
  } catch(e){}
  // Chrome/Edge: captures Esc and other keys while fullscreen (Esc then needs a long hold)
  try { await navigator.keyboard?.lock?.(); } catch(e){}
}
/* Pointer lock: the mouse can no longer reach the top edge, so the browser's exit "X" never appears */
let vx = innerWidth/2, vy = innerHeight/2;   // virtual cursor position
function grabPointer(){
  try {
    if (!document.pointerLockElement) {
      const p = document.documentElement.requestPointerLock?.({ unadjustedMovement:true });
      if (p && p.catch) p.catch(() => { try { document.documentElement.requestPointerLock(); } catch(e){} });
    }
  } catch(e){}
}
addEventListener("mousemove", e => {
  if (!locked) return;
  if (document.pointerLockElement) {
    vx = Math.min(W, Math.max(0, vx + e.movementX));
    vy = Math.min(H, Math.max(0, vy + e.movementY));
  } else { vx = e.clientX; vy = e.clientY; }
  if (Math.random() < 0.25) sparkles.push(newSpark(vx, vy));
}, true);
async function requestWake(){
  try { wakeLock = await navigator.wakeLock?.request("screen"); } catch(e){}
}
async function lockUp(){
  locked = true;
  startEl.classList.add("hidden");
  document.body.classList.add("locked");
  grabPointer();
  await enterFullscreen();
  grabPointer();
  requestWake();
}
async function unlock(){
  locked = false;
  document.body.classList.remove("locked");
  try { navigator.keyboard?.unlock?.(); } catch(e){}
  try { document.exitPointerLock?.(); } catch(e){}
  try { await wakeLock?.release(); } catch(e){}
  try { if (document.fullscreenElement) await document.exitFullscreen(); } catch(e){}
  startEl.classList.remove("hidden");
}
document.getElementById("startBtn").addEventListener("click", lockUp);

/* On first load only: any click, tap or key press anywhere starts it */
let firstLoad = true;
function autoStart(e){
  if (!firstLoad || locked) return;
  firstLoad = false;
  e.preventDefault();
  lockUp();
}
addEventListener("pointerdown", autoStart, true);
addEventListener("keydown", autoStart, true);

function isSecret(e){
  return e.code === SECRET.code && e.shiftKey === SECRET.shift && e.ctrlKey === SECRET.ctrl && e.altKey === SECRET.alt;
}

/* If baby somehow leaves fullscreen, the next touch/key brings it right back */
function reenter(){ if (!locked) return; if (!document.fullscreenElement) enterFullscreen(); grabPointer(); }
document.addEventListener("visibilitychange", () => { if (locked && document.visibilityState==="visible") requestWake(); });

/* ---------- Input blocking ---------- */
function block(e){ e.preventDefault(); e.stopPropagation(); }

addEventListener("keydown", e => {
  if (!locked) return;
  if (isSecret(e)) { block(e); unlock(); return; }
  block(e); reenter();
  if (!e.repeat) burst(Math.random()*W, Math.random()*H*0.8 + H*0.1);
}, true);
addEventListener("keyup", e => { if (locked) block(e); }, true);
addEventListener("keypress", e => { if (locked) block(e); }, true);

["contextmenu","dblclick","auxclick","dragstart","selectstart","wheel","copy","cut","paste"].forEach(t =>
  addEventListener(t, e => { if (locked) block(e); }, { capture:true, passive:false }));

addEventListener("pointerdown", e => {
  if (!locked) return;
  block(e); reenter(); burst(document.pointerLockElement ? vx : e.clientX, document.pointerLockElement ? vy : e.clientY);
}, true);

addEventListener("beforeunload", e => { if (locked) { e.preventDefault(); e.returnValue = ""; } });

/* ---------- Soft pop sound ---------- */
let actx;
function pop(){
  if (!SOUND_ON_TOUCH) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = "sine"; o.frequency.value = 380 + Math.random()*500;
    g.gain.setValueAtTime(0.08, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.25);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + 0.25);
  } catch(e){}
}

/* ---------- Cartoon world ---------- */
const rand = (a,b) => a + Math.random()*(b-a);
const COLORS = ["#ff6b9a","#ffd23f","#4ecdc4","#a78bfa","#ff9f45","#6bd66b","#5aa9ff"];

const clouds = Array.from({length:6}, () => ({ x:rand(0,1), y:rand(0.06,0.32), s:rand(0.7,1.4), v:rand(0.006,0.016) }));
const stars  = Array.from({length:18}, () => ({ x:rand(0,1), y:rand(0,0.45), p:rand(0,6) }));
const bubbles = Array.from({length:22}, () => newBubble(true));
const animals = ["🐥","🐻","🐶","🐱","🐸","🐰","🐼","🦁"].map((e,i,a) => ({
  e, x:(i+0.5)/a.length, vy:0, y:0, ph:rand(0,6), jump:rand(2.2,4.5), size:0
}));
let sparkles = [], pops = [];

function newBubble(init){
  return { x:rand(0,1), y: init ? rand(0,1) : 1.1, r:rand(10,34), v:rand(0.04,0.1), w:rand(0,6), c:COLORS[(Math.random()*COLORS.length)|0] };
}
function newSpark(x,y){
  return { x,y, vx:rand(-60,60), vy:rand(-90,-20), life:1, c:COLORS[(Math.random()*COLORS.length)|0], r:rand(4,9) };
}
function burst(x,y){
  for (let i=0;i<26;i++){
    const a = rand(0,Math.PI*2), s = rand(80,320);
    sparkles.push({ x,y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:1, c:COLORS[(Math.random()*COLORS.length)|0], r:rand(5,12) });
  }
  const em = ["⭐","🎈","🦋","🌈","🍎","🎵","🌼","🐝","💖"];
  pops.push({ x,y, e:em[(Math.random()*em.length)|0], t:0 });
  pop();
}

function drawSky(t){
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#79d0ff"); g.addColorStop(0.65,"#c9f0ff"); g.addColorStop(1,"#fff4c2");
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
}
function drawRainbow(t){
  const cx = W*0.72, cy = H*0.72, base = Math.min(W,H)*0.55;
  const cols = ["#ff6b6b","#ff9f45","#ffd23f","#6bd66b","#5aa9ff","#a78bfa"];
  ctx.save(); ctx.globalAlpha = 0.65; ctx.lineWidth = base*0.05;
  cols.forEach((c,i) => { ctx.strokeStyle = c; ctx.beginPath(); ctx.arc(cx,cy, base - i*base*0.05, Math.PI, 0); ctx.stroke(); });
  ctx.restore();
}
function drawSun(t){
  const x = W*0.14, y = H*0.17, r = Math.min(W,H)*0.085;
  ctx.save(); ctx.translate(x,y);
  ctx.strokeStyle = "#ffb703"; ctx.lineWidth = r*0.14; ctx.lineCap = "round";
  for (let i=0;i<12;i++){
    const a = i*Math.PI/6 + t*0.3, len = r*(1.5 + Math.sin(t*2+i)*0.12);
    ctx.beginPath(); ctx.moveTo(Math.cos(a)*r*1.25, Math.sin(a)*r*1.25); ctx.lineTo(Math.cos(a)*len*1.25, Math.sin(a)*len*1.25); ctx.stroke();
  }
  ctx.fillStyle = "#ffd23f"; ctx.beginPath(); ctx.arc(0,0,r,0,7); ctx.fill();
  ctx.fillStyle = "#ff8fa3"; ctx.globalAlpha = .6;
  ctx.beginPath(); ctx.arc(-r*.5,r*.25,r*.16,0,7); ctx.arc(r*.5,r*.25,r*.16,0,7); ctx.fill(); ctx.globalAlpha = 1;
  const blink = (Math.sin(t*1.3) > 0.97) ? 0.1 : 1;
  ctx.fillStyle = "#3b2a6e";
  ctx.beginPath(); ctx.ellipse(-r*.32,-r*.1,r*.09,r*.14*blink,0,0,7); ctx.ellipse(r*.32,-r*.1,r*.09,r*.14*blink,0,0,7); ctx.fill();
  ctx.strokeStyle = "#3b2a6e"; ctx.lineWidth = r*.07;
  ctx.beginPath(); ctx.arc(0,r*.08,r*.34,0.2,Math.PI-0.2); ctx.stroke();
  ctx.restore();
}
function cloud(x,y,s){
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s); ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.arc(0,0,28,0,7); ctx.arc(34,-10,36,0,7); ctx.arc(74,0,28,0,7); ctx.rect(0,0,74,28); ctx.arc(30,10,26,0,7);
  ctx.fill(); ctx.restore();
}
function drawHills(){
  ctx.fillStyle = "#8ee08e"; ctx.beginPath(); ctx.moveTo(0,H);
  for (let x=0;x<=W;x+=20) ctx.lineTo(x, H*0.78 + Math.sin(x/W*3.2+1)*H*0.04);
  ctx.lineTo(W,H); ctx.fill();
  ctx.fillStyle = "#5fcf6b"; ctx.beginPath(); ctx.moveTo(0,H);
  for (let x=0;x<=W;x+=20) ctx.lineTo(x, H*0.88 + Math.sin(x/W*4.5+3)*H*0.03);
  ctx.lineTo(W,H); ctx.fill();
}
function drawFlowers(t){
  for (let i=0;i<10;i++){
    const x = (i+0.5)/10*W + Math.sin(i*5)*20, y = H*0.93 + Math.sin(i*2)*H*0.02, sw = Math.sin(t*2+i)*4;
    ctx.strokeStyle = "#3aa655"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(x,y+22); ctx.quadraticCurveTo(x+sw,y+10,x+sw,y); ctx.stroke();
    ctx.fillStyle = COLORS[i%COLORS.length];
    for (let p=0;p<5;p++){ const a = p*Math.PI*2/5; ctx.beginPath(); ctx.arc(x+sw+Math.cos(a)*9, y+Math.sin(a)*9, 7, 0, 7); ctx.fill(); }
    ctx.fillStyle = "#fff3a0"; ctx.beginPath(); ctx.arc(x+sw,y,6,0,7); ctx.fill();
  }
}

let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now-last)/1000); last = now; const t = now/1000;

  drawSky(t); drawSun(t); drawRainbow(t);

  stars.forEach(s => {
    ctx.globalAlpha = 0.25 + 0.25*Math.sin(t*2+s.p); ctx.font = "22px serif"; ctx.textAlign = "center";
    ctx.fillText("✨", s.x*W, s.y*H);
  }); ctx.globalAlpha = 1;

  clouds.forEach(c => { c.x += c.v*dt; if (c.x > 1.2) c.x = -0.2; cloud(c.x*W, c.y*H, c.s*Math.min(1, W/900+0.4)); });

  drawHills();

  bubbles.forEach((b,i) => {
    b.y -= b.v*dt; b.w += dt;
    if (b.y < -0.1) bubbles[i] = newBubble(false);
    const x = b.x*W + Math.sin(b.w*1.5)*20, y = b.y*H;
    ctx.globalAlpha = 0.55; ctx.fillStyle = b.c; ctx.beginPath(); ctx.arc(x,y,b.r,0,7); ctx.fill();
    ctx.globalAlpha = 0.8; ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(x-b.r*.3,y-b.r*.3,b.r*.22,0,7); ctx.fill();
    ctx.globalAlpha = 1;
  });

  drawFlowers(t);

  // bouncing animals with squash & stretch
  const ground = H*0.9, size = Math.max(48, Math.min(W/9, 110));
  animals.forEach(a => {
    if (a.y === 0 && a.vy === 0 && Math.sin(t*0.9 + a.ph) > 0.2) a.vy = -a.jump*size*1.9;
    a.vy += size*7*dt; a.y += a.vy*dt;
    let squash = 1;
    if (a.y >= 0){ if (a.vy > 0 && a.vy > 40) squash = 0.8; a.y = 0; a.vy = 0; }
    const sx = squash < 1 ? 1.2 : 1 - Math.min(0.1, Math.abs(a.vy)/(size*60)), sy = squash < 1 ? 0.8 : 1 + Math.min(0.12, Math.abs(a.vy)/(size*45));
    const x = a.x*W + Math.sin(t*0.6 + a.ph)*14;
    ctx.fillStyle = "rgba(0,0,0,.12)";
    ctx.beginPath(); ctx.ellipse(x, ground+size*0.12, size*0.4*(1+a.y/(size*6)), size*0.1, 0, 0, 7); ctx.fill();
    ctx.save(); ctx.translate(x, ground + a.y); ctx.scale(sx,sy);
    ctx.font = size + "px serif"; ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
    ctx.fillText(a.e, 0, 0); ctx.restore();
  });

  // sparkles from baby's touches
  sparkles = sparkles.filter(p => p.life > 0);
  sparkles.forEach(p => {
    p.life -= dt*1.2; p.vy += 260*dt; p.x += p.vx*dt; p.y += p.vy*dt;
    ctx.globalAlpha = Math.max(0,p.life); ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r*p.life+1,0,7); ctx.fill();
  }); ctx.globalAlpha = 1;

  pops = pops.filter(p => p.t < 1.4);
  pops.forEach(p => {
    p.t += dt; const k = Math.min(1, p.t*4), s = 40 + 90*(1 - Math.pow(1-k,3));
    ctx.globalAlpha = Math.max(0, 1 - Math.max(0,p.t-0.8)/0.6);
    ctx.font = s + "px serif"; ctx.textAlign = "center"; ctx.fillText(p.e, p.x, p.y - p.t*50);
  }); ctx.globalAlpha = 1;

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
